        extend: {

            gold: {

              600: '#AA820A',

            navy: {
              800: '#0F1A30',
              900: '#0B1325',
              950: '#070C16',

          animation: {
            'fade-in': 'fadeIn 0.4s ease-out forwards',
            'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },

    const REVIEWS = [
      {
        name: "Supriya Singh",
        rating: 5,
        date: "2 months ago",
        comment: "The service here is extremely good! Bhanu from the showroom gave extremely good attention and the hectic wedding shopping turned out to be seamless."
      },
      {
        name: "Ashwin Potfode",
        rating: 5,
        date: "3 months ago",
        comment: "The shop's collection is fantastic; the quality, designs, and variety of clothes are all excellent. Once you visit, it's hard to leave without buying!"
      },
      {
        name: "Deepak Sharma",
        rating: 5,
        date: "1 month ago",
        comment: "Best ethnic store in M.T Cloth Market Indore. Got my entire wedding attire customized here. Superb fabric & craftsmanship!"
      }

    function App() {
      // Load products from localStorage or fallback to initial products
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('porwal_store_products_v2');
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      });

      // Save products to localStorage whenever they change
      useEffect(() => {
        localStorage.setItem('porwal_store_products_v2', JSON.stringify(products));
      }, [products]);

      const [cart, setCart] = useState(() => {
        const saved = localStorage.getItem('porwal_store_cart');
        return saved ? JSON.parse(saved) : [];
      });

      useEffect(() => {
        localStorage.setItem('porwal_store_cart', JSON.stringify(cart));
      }, [cart]);

      const [favorites, setFavorites] = useState([]);
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [isCartOpen, setIsCartOpen] = useState(false);
      
      // Admin Authentication State (persisted with session/local storage)
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(() => {
        return localStorage.getItem('porwal_admin_auth') === 'true';
      });
      const [isAdminLoginOpen, setIsAdminLoginOpen] = useState(false);
      const [adminDashboardOpen, setAdminDashboardOpen] = useState(false);
      const [adminPin, setAdminPin] = useState("");
      const [loginError, setLoginError] = useState("");

      const [selectedProductModal, setSelectedProductModal] = useState(null);

      // Customer Details State
      const [customerName, setCustomerName] = useState("");
      const [customerPhone, setCustomerPhone] = useState("");
      const [customerAddress, setCustomerAddress] = useState("");

      // Add Product Form State
      const [newProduct, setNewProduct] = useState({
        name: "",
        category: "Kurta Pajama",
        price: "",
        originalPrice: "",
        image: "",
        description: "",
        tag: "New Arrival"
      });

      const categories = ["All", "Kurta Pajama", "Sherwani", "Wedding Suits", "Indo-Western", "Nehru Jackets", "Fabrics"];

      const filteredProducts = useMemo(() => {
        return products.filter((item) => {
          const matchesCategory = selectedCategory === "All" || item.category === selectedCategory;
          const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                item.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                item.category.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });
      }, [products, selectedCategory, searchQuery]);

      const addToCart = (product) => {
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
          }
          return [...prev, { ...product, quantity: 1 }];
        });
        setIsCartOpen(true);
      };

      const updateQuantity = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const removeFromCart = (id) => {
        setCart(prev => prev.filter(item => item.id !== id));
      };

      const toggleFavorite = (id) => {
        setFavorites(prev => prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]);
      };

      const cartTotal = useMemo(() => {
        return cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      }, [cart]);

      const totalCartCount = useMemo(() => {
        return cart.reduce((sum, item) => sum + item.quantity, 0);
      }, [cart]);

      const handleAdminLoginSubmit = (e) => {
        e.preventDefault();
        // Default admin password set as 'porwal2026'
        if (adminPin === "porwal2026") {
          setIsAdminAuthenticated(true);
          localStorage.setItem('porwal_admin_auth', 'true');
          setIsAdminLoginOpen(false);
          setAdminDashboardOpen(true);
          setAdminPin("");
          setLoginError("");
        } else {
          setLoginError("Invalid Admin PIN. (Default test PIN: porwal2026)");
        }
      };

      const handleAdminActionClick = () => {
        if (isAdminAuthenticated) {
          setAdminDashboardOpen(true);
        } else {
          setIsAdminLoginOpen(true);
        }
      };

      const handleAdminLogout = () => {
        setIsAdminAuthenticated(false);
        localStorage.removeItem('porwal_admin_auth');
        setAdminDashboardOpen(false);
      };

      const deleteProduct = (id) => {
        if (window.confirm("Are you sure you want to remove this product from the storefront?")) {
          setProducts(prev => prev.filter(item => item.id !== id));
        }
      };

      const sendWhatsAppOrder = (e) => {
        e.preventDefault();
        if (cart.length === 0) return;
        if (!customerName || !customerPhone) {
          alert("Please provide your Name and Phone Number for direct store dispatch!");
          return;
        }

        const storeNumber = "918818888210";
        let message = `*NEW ORDER INQUIRY - THE PORWAL SHOP*\n`;
        message += `──────────────────────\n`;
        message += `*Customer Details:*\n`;
        message += `👤 *Name:* ${customerName}\n`;
        message += `📞 *Phone:* ${customerPhone}\n`;
        if (customerAddress) message += `📍 *Address/City:* ${customerAddress}\n`;
        message += `──────────────────────\n`;
        message += `*Selected Items:*\n\n`;

        cart.forEach((item, index) => {
          message += `${index + 1}. *${item.name}*\n`;
          message += `   • Category: ${item.category}\n`;
          message += `   • Qty: ${item.quantity} x ₹${item.price.toLocaleString('en-IN')}\n`;
          message += `   • Subtotal: ₹${(item.price * item.quantity).toLocaleString('en-IN')}\n\n`;
        });

        message += `──────────────────────\n`;
        message += `💰 *Grand Total:* ₹${cartTotal.toLocaleString('en-IN')}\n`;
        message += `──────────────────────\n`;
        message += `Please confirm availability and dispatch options. Thank you!`;

        const encodedMsg = encodeURIComponent(message);
        window.open(`https://wa.me/${storeNumber}?text=${encodedMsg}`, '_blank');
      };

      const handleAddProductSubmit = (e) => {
        e.preventDefault();
        if (!newProduct.name || !newProduct.price) {
          alert("Please enter product title and price");
          return;
        }

        const createdProduct = {
          id: Date.now(),
          name: newProduct.name,
          category: newProduct.category,
          price: parseFloat(newProduct.price),
          originalPrice: newProduct.originalPrice ? parseFloat(newProduct.originalPrice) : parseFloat(newProduct.price) * 1.2,
          image: newProduct.image || "https://images.unsplash.com/photo-1617137984095-74e4e5e3613f?auto=format&fit=crop&q=80&w=800",
          description: newProduct.description || "Bespoke ethnic attire crafted with top-grade fabric for festive occasions.",
          tag: newProduct.tag || "New Arrival"
        };

        setProducts(prev => [createdProduct, ...prev]);
        setNewProduct({
          name: "",
          category: "Kurta Pajama",
          price: "",
          originalPrice: "",
          image: "",
          description: "",
          tag: "New Arrival"
        });
        alert("Product successfully added and saved to store persistence!");
      };

      return (
        <div className="min-h-screen bg-navy-950 text-slate-100 font-sans selection:bg-gold-500 selection:text-black antialiased animate-fade-in">
          
          {/* Top Banner */}
          <div className="bg-gradient-to-r from-amber-700 via-gold-500 to-amber-700 text-black text-xs sm:text-sm py-1.5 px-4 font-bold text-center tracking-wider shadow-md">
            <span>✨ VISIT OUR INDORE STORE OR ORDER DIRECTLY ON WHATSAPP (+91 88188 88210)</span>
          </div>

          {/* Header Bar */}
          <header className="sticky top-0 z-40 bg-navy-900/90 backdrop-blur-md border-b border-gold-500/20 shadow-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
              
              <div className="flex items-center space-x-3 cursor-pointer group" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}>
                <div className="w-12 h-12 rounded-full bg-gradient-to-tr from-amber-600 via-gold-400 to-yellow-200 p-0.5 shadow-lg shadow-gold-500/20 flex items-center justify-center transform group-hover:scale-105 transition-transform">
                  <div className="w-full h-full bg-navy-900 rounded-full flex items-center justify-center border border-gold-400/30">
                    <Icon name="Store" className="w-6 h-6 text-gold-400" />
                  </div>
                </div>
                <div>
                  <h1 className="text-xl sm:text-2xl font-serif font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-gold-400 to-amber-500 tracking-wide">
                    THE PORWAL SHOP
                  </h1>
                  <p className="text-[10px] sm:text-xs text-gold-300/70 tracking-widest uppercase font-medium">
                    Men's Ethnic Store • Indore
                  </p>
                </div>
              </div>

              {/* Desktop Nav */}
              <nav className="hidden md:flex items-center space-x-8 text-sm font-medium">
                <a href="#" className="text-gold-400 font-semibold border-b-2 border-gold-400 pb-1">Home</a>
                <a href="#catalog-section" className="text-slate-300 hover:text-gold-400 transition-colors">Collections</a>
                <a href="#reviews-section" className="text-slate-300 hover:text-gold-400 transition-colors flex items-center gap-1.5">
                  Reviews
                  <span className="bg-gold-500/20 text-gold-300 px-2 py-0.5 rounded-full text-xs border border-gold-500/30 flex items-center gap-1">
                    <Icon name="Star" className="w-3 h-3 text-gold-400" /> 4.4
                  </span>
                </a>
                <a href="#store-info" className="text-slate-300 hover:text-gold-400 transition-colors">Store Location</a>
              </nav>

                        required
                        value={customerPhone}
                        onChange={(e) => setCustomerPhone(e.target.value)}
                        className="w-full bg-navy-950 text-xs text-slate-100 p-2.5 rounded-lg border border-slate-800 focus:outline-none focus:border-gold-400"
                      />
                      <input 
                        type="text" 
                        placeholder="Delivery City / Address (Optional)"
                        value={customerAddress}
                        onChange={(e) => setCustomerAddress(e.target.value)}
                        className="w-full bg-navy-950 text-xs text-slate-100 p-2.5 rounded-lg border border-slate-800 focus:outline-none focus:border-gold-400"
                      />
                    </div>

                    <div className="pt-2 border-t border-slate-800 flex justify-between items-center text-sm font-semibold">
                      <span className="text-slate-400">Total Order Amount:</span>
                      <span className="text-lg text-gold-400 font-bold">₹{cartTotal.toLocaleString('en-IN')}</span>
                    </div>

                    <button 
                      type="submit"
                      className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30 transition-all"
                    >
                      <Icon name="Send" className="w-4 h-4" />
                      <span>Order Directly via WhatsApp</span>
                    </button>
                  </form>
                )}

              </div>
            </div>
          )}

          {/* Admin Login Modal */}
          {isAdminLoginOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
              <div className="bg-navy-900 w-full max-w-md rounded-2xl border border-gold-500/40 shadow-2xl p-6 space-y-5 relative">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center space-x-2 text-gold-400">
                    <Icon name="Lock" className="w-5 h-5" />
                    <h3 className="font-serif font-bold text-lg text-white">Owner / Admin Authentication</h3>
                  </div>
                  <button onClick={() => setIsAdminLoginOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="X" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleAdminLoginSubmit} className="space-y-4 text-xs">
                  <p className="text-slate-300 text-xs leading-relaxed">
                    Enter the authorized store owner security PIN to access the product addition and catalog management panel.
                  </p>
                  
                  <div>
                    <label className="block text-slate-300 font-medium mb-1">Admin Security PIN *</label>
                    <input 
                      type="password" 
                      required
                      placeholder="Enter PIN (Default: porwal2026)"
                      value={adminPin}
                      onChange={(e) => setAdminPin(e.target.value)}
                      className="w-full bg-navy-950 text-slate-100 p-3 rounded-xl border border-slate-700 focus:border-gold-400 outline-none font-mono tracking-widest text-sm"
                    />
                  </div>

                  {loginError && (
                    <p className="text-rose-400 text-xs bg-rose-950/40 p-2.5 rounded-lg border border-rose-900">{loginError}</p>
                  )}

                  <div className="pt-2 flex justify-end space-x-3">
                    <button 
                      type="button" 
                      onClick={() => setIsAdminLoginOpen(false)}
                      className="px-4 py-2.5 bg-slate-800 text-slate-300 font-semibold rounded-xl"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      className="px-6 py-2.5 bg-gold-500 hover:bg-gold-600 text-black font-bold rounded-xl shadow-lg"
                    >
                      Verify & Login
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Admin Dashboard & Add/Remove Product Modal */}
          {adminDashboardOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
              <div className="bg-navy-900 w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-2xl border border-gold-500/40 shadow-2xl p-6 space-y-6 relative">
                
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center space-x-2 text-gold-400">
                    <Icon name="Shield" className="w-5 h-5" />
                    <h3 className="font-serif font-bold text-lg text-white">Store Owner Management Dashboard</h3>
                  </div>
                  <div className="flex items-center gap-3">
                    <button 
                      onClick={handleAdminLogout}
                      className="text-xs text-rose-400 hover:underline flex items-center gap-1"
                    >
                      <Icon name="LogOut" className="w-3.5 h-3.5" />
                      <span>Logout</span>
                    </button>
                    <button onClick={() => setAdminDashboardOpen(false)} className="text-slate-400 hover:text-white">
                      <Icon name="X" className="w-5 h-5" />
                    </button>
                  </div>
                </div>

                {/* Add Product Form Section */}
                <div className="bg-navy-950 p-5 rounded-2xl border border-slate-800 space-y-4">
                  <h4 className="font-serif font-bold text-sm text-gold-300 flex items-center gap-2">
                    <Icon name="PlusCircle" className="w-4 h-4 text-gold-400" />
                    <span>Add New Product to Storefront</span>
                  </h4>

                  <form onSubmit={handleAddProductSubmit} className="space-y-3 text-xs">
                    <div>
                      <label className="block text-slate-300 font-medium mb-1">Product Title / Name *</label>
                      <input 
                        type="text" 
                        required
                        placeholder="e.g. Designer Embroidered Silk Kurta Set"
                        value={newProduct.name}
                        onChange={(e) => setNewProduct({ ...newProduct, name: e.target.value })}
                        className="w-full bg-navy-900 text-slate-100 p-2.5 rounded-xl border border-slate-700 focus:border-gold-400 outline-none"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-slate-300 font-medium mb-1">Category *</label>
                        <select 
                          value={newProduct.category}
                          onChange={(e) => setNewProduct({ ...newProduct, category: e.target.value })}
                          className="w-full bg-navy-900 text-slate-100 p-2.5 rounded-xl border border-slate-700 focus:border-gold-400 outline-none"
                        >
                          {categories.filter(c => c !== "All").map(c => (
                            <option key={c} value={c}>{c}</option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block text-slate-300 font-medium mb-1">Badge Tag</label>
                        <input 
                          type="text" 
                          placeholder="e.g. New Arrival, Festive"
                          value={newProduct.tag}
                          onChange={(e) => setNewProduct({ ...newProduct, tag: e.target.value })}
                          className="w-full bg-navy-900 text-slate-100 p-2.5 rounded-xl border border-slate-700 focus:border-gold-400 outline-none"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-slate-300 font-medium mb-1">Selling Price (₹) *</label>
                        <input 
                          type="number" 
                          required
                          placeholder="5999"
                          value={newProduct.price}
                          onChange={(e) => setNewProduct({ ...newProduct, price: e.target.value })}
                          className="w-full bg-navy-900 text-slate-100 p-2.5 rounded-xl border border-slate-700 focus:border-gold-400 outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-300 font-medium mb-1">Original Price (₹)</label>
                        <input 
                          type="number" 
                          placeholder="7999"
                          value={newProduct.originalPrice}
                          onChange={(e) => setNewProduct({ ...newProduct, originalPrice: e.target.value })}
                          className="w-full bg-navy-900 text-slate-100 p-2.5 rounded-xl border border-slate-700 focus:border-gold-400 outline-none"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-slate-300 font-medium mb-1">Image URL</label>
                      <input 
                        type="url" 
                        placeholder="https://images.unsplash.com/..."
                        value={newProduct.image}
                        onChange={(e) => setNewProduct({ ...newProduct, image: e.target.value })}
                        className="w-full bg-navy-900 text-slate-100 p-2.5 rounded-xl border border-slate-700 focus:border-gold-400 outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-slate-300 font-medium mb-1">Description</label>
                      <textarea 
                        rows="2"
                        placeholder="Detailed fabric info, embroidery style..."
                        value={newProduct.description}
                        onChange={(e) => setNewProduct({ ...newProduct, description: e.target.value })}
                        className="w-full bg-navy-900 text-slate-100 p-2.5 rounded-xl border border-slate-700 focus:border-gold-400 outline-none"
                      ></textarea>
                    </div>

                    <button 
                      type="submit" 
                      className="w-full py-3 bg-gold-500 hover:bg-gold-600 text-black font-bold rounded-xl shadow-lg transition-all"
                    >
                      Publish Item to Storefront
                    </button>
                  </form>
                </div>

                {/* Manage Existing Products */}
                <div className="space-y-3">
                  <h4 className="font-serif font-bold text-sm text-slate-200">
                    Existing Store Products ({products.length})
                  </h4>
                  <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                    {products.map(p => (
                      <div key={p.id} className="flex items-center justify-between bg-navy-950 p-3 rounded-xl border border-slate-800 text-xs">
                        <div className="flex items-center gap-3">
                          <img src={p.image} alt={p.name} className="w-10 h-10 object-cover rounded-lg" />
                          <div>
                            <p className="font-semibold text-white truncate max-w-[220px] sm:max-w-xs">{p.name}</p>
                            <p className="text-gold-400 font-bold">₹{p.price.toLocaleString('en-IN')}</p>
                          </div>
                        </div>
                        <button 
                          onClick={() => deleteProduct(p.id)}
                          className="px-3 py-1.5 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white rounded-lg border border-rose-500/30 transition-all flex items-center gap-1 font-semibold"
                        >
                          <Icon name="Trash2" className="w-3.5 h-3.5" />
                          <span>Remove</span>
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* Quick View Modal */}
          {selectedProductModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
              <div className="bg-navy-900 w-full max-w-2xl rounded-2xl border border-gold-500/40 shadow-2xl overflow-hidden flex flex-col md:flex-row relative">
                <button 
                  onClick={() => setSelectedProductModal(null)}
                  className="absolute top-3 right-3 z-10 p-2 bg-black/60 text-slate-300 hover:text-white rounded-full"
                >
                  <Icon name="X" className="w-5 h-5" />
                </button>

                <div className="w-full md:w-1/2 aspect-[4/5] bg-slate-900">
                  <img 
                    src={selectedProductModal.image} 
                    alt={selectedProductModal.name} 
                    className="w-full h-full object-cover"
                  />
                </div>

                <div className="w-full md:w-1/2 p-6 flex flex-col justify-between space-y-4">
                  <div className="space-y-3">
                    <span className="text-gold-400 text-xs font-semibold uppercase tracking-wider">
                      {selectedProductModal.category}
                    </span>
                    <h3 className="text-2xl font-serif font-bold text-white">
                      {selectedProductModal.name}
                    </h3>
                    <div className="text-2xl font-bold text-gold-400">
                      ₹{selectedProductModal.price.toLocaleString('en-IN')}
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed">
                      {selectedProductModal.description}
                    </p>
                  </div>

                  <div className="flex items-center space-x-3 pt-4 border-t border-slate-800">
                    <button 
                      onClick={() => {
                        addToCart(selectedProductModal);
                        setSelectedProductModal(null);
                      }}
                      className="flex-1 py-3 bg-gold-500 hover:bg-gold-600 text-black font-bold rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-gold-500/20"
                    >
                      <Icon name="ShoppingBag" className="w-4 h-4" />
                      <span>Add to Cart</span>
                    </button>
                  </div>

                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
